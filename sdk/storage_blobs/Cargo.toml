[package]
name = "azure_storage_blobs"
version = "0.19.0"
description = "Azure Blob Storage crate from the Azure SDK for Rust"
readme = "README.md"
authors = ["Microsoft Corp."]
license = "MIT"
repository = "https://github.com/azure/azure-sdk-for-rust"
homepage = "https://github.com/azure/azure-sdk-for-rust"
documentation = "https://docs.rs/azure_storage_blobs"
keywords = ["sdk", "azure", "storage", "blobs"]
categories = ["api-bindings"]
edition = "2021"

[dependencies]
azure_core = { path = "../core", version = "0.19", features = ["xml"] }
azure_storage = { path = "../storage", version = "0.19", default-features = false }
azure_svc_blobstorage = {path="../../services/svc/blobstorage", version = "0.19", default-features=false, features=["default_tag"]}
bytes = "1.11"
time = "0.3.47"
futures = "0.3"
tracing = "0.1.44"
md5 = {version="0.8", optional=true}
RustyXML = "0.3"
serde = { version = "1.0" }
serde_derive = "1.0"
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
url = "2.5"

[dev-dependencies]
tokio = {version = "1.50", features = ["macros", "rt-multi-thread", "io-util"]}
tracing-subscriber = "0.3"
mock_transport = { path = "../../eng/test/mock_transport" }
md5 = "0.8"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
azure_core = {path = "../core", version = "0.19", features = ["tokio-fs"]}

[features]
default = ["hmac_rust"]
test_e2e = []
test_integration = []
azurite_workaround = ["azure_core/azurite_workaround"]
md5 = ["dep:md5"]
hmac_rust = ["azure_core/hmac_rust"]
hmac_openssl = ["azure_core/hmac_openssl"]

[package.metadata.docs.rs]
features = ["enable_reqwest", "enable_reqwest_rustls", "hmac_rust", "hmac_openssl", "md5", "azurite_workaround"]
